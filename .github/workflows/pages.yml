# Static GitHub Pages build (optional).
# Full Next.js features need Vercel; see GITHUB_PAGES.md.
name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Note — static export not enabled by default
        run: |
          echo "Harbiden Bak is a Next.js App Router app."
          echo "Enable output:'export' + generateStaticParams before using this job for real Pages deploys."
          echo "See GITHUB_PAGES.md. Prefer Vercel for www.harbidenbak.com."
          npm run build
      - name: Upload artifact if out/ exists
        if: ${{ hashFiles('out/**') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: ${{ hashFiles('out/**') != '' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
